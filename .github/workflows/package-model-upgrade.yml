name: Dependency remediation

on:
  push:
    branches:
      - maintenance/package-model-upgrade
    paths:
      - .github/workflows/package-model-upgrade.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: maintenance/package-model-upgrade

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci

      - name: Apply compatible audit fixes
        run: npm audit fix || true

      - name: Production audit after remediation
        run: npm audit --omit=dev --json || true

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Commit safe lockfile remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No compatible lockfile fixes available"
          else
            git commit -m "chore: remediate compatible transitive dependencies"
            git push origin maintenance/package-model-upgrade
          fi
