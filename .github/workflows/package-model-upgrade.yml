name: Dependency audit

on:
  push:
    branches:
      - maintenance/package-model-upgrade
    paths:
      - .github/workflows/package-model-upgrade.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: maintenance/package-model-upgrade

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit production dependency tree
        run: npm audit --omit=dev --json || true
